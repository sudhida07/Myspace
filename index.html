<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Expense Tracker</h1>
    <p class="tagline">Track every rupee. Stored locally in your browser.</p>
  </header>

  <main>
    <section class="card summary">
      <div class="stat">
        <span class="label">Total spent</span>
        <span id="total" class="value">₹0.00</span>
      </div>
      <div class="stat">
        <span class="label">This month</span>
        <span id="month-total" class="value">₹0.00</span>
      </div>
      <div class="stat">
        <span class="label">Entries</span>
        <span id="count" class="value">0</span>
      </div>
    </section>

    <section class="card">
      <h2>Add expense</h2>
      <form id="expense-form">
        <div class="row">
          <label>
            Amount (₹)
            <input type="number" id="amount" step="0.01" min="0" required />
          </label>
          <label>
            Category
            <select id="category" required>
              <option value="Food">Food</option>
              <option value="Travel">Travel</option>
              <option value="Shopping">Shopping</option>
              <option value="Bills">Bills</option>
              <option value="Health">Health</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Investment">Investment</option>
              <option value="Other">Other</option>
            </select>
          </label>
          <label>
            Date
            <input type="date" id="date" required />
          </label>
        </div>
        <label>
          Note (optional)
          <input type="text" id="note" maxlength="120" placeholder="e.g. Lunch with team" />
        </label>
        <button type="submit">Add expense</button>
      </form>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>By category</h2>
      </div>
      <div id="by-category" class="by-category"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>All expenses</h2>
        <div class="actions">
          <input type="search" id="search" placeholder="Search note/category…" />
          <button id="export-btn" type="button">Export CSV</button>
          <button id="clear-btn" type="button" class="danger">Clear all</button>
        </div>
      </div>
      <div class="table-wrap">
        <table id="expense-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Category</th>
              <th>Note</th>
              <th class="num">Amount</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <p id="empty" class="empty">No expenses yet. Add your first one above.</p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
