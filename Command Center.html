<script>
// Suppress benign ResizeObserver loop warning (browser-internal, no impact)
const _origError = window.console.error;
window.console.error = (...args) => {
  if (args[0] && typeof args[0] === "string" && args[0].includes("ResizeObserver")) return;
  _origError.apply(window.console, args);
};
window.addEventListener("error", (e) => {
  if (e.message && e.message.includes("ResizeObserver")) {
    e.stopImmediatePropagation();
    e.preventDefault();
    return false;
  }
}, true);
const _origRO = window.ResizeObserver;
if (_origRO) {
  window.ResizeObserver = class extends _origRO {
    constructor(cb) {
      super((entries, obs) => {
        window.requestAnimationFrame(() => { try { cb(entries, obs); } catch (e) {} });
      });
    }
  };
}
</script>
